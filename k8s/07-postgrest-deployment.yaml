apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgrest
  namespace: desafio-kubernetes

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgrest

  template:
    metadata:
      labels:
        app: postgrest

    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest

          ports:
            - containerPort: 3000

          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_DB_URI

            - name: PGRST_DB_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_DB_SCHEMAS

            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_DB_ANON_ROLE
                  